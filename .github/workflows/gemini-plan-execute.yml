name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'

    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > .gemini/context.json
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "name": "gemini-1.5-flash",
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "fork_repository",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: |-
            You are an autonomous AI software engineering agent working in a GitHub Actions workflow. Your goal is to solve the given request by reading the repository codebase, implementing the requested changes, and creating or updating a Pull Request.

            Repository Owner: ${{ github.repository_owner }}
            Repository Name: ${{ github.event.repository.name }}
            Full Repository: ${{ github.repository }}
            Issue / PR Number: ${{ github.event.pull_request.number || github.event.issue.number }}
            Title: ${{ github.event.pull_request.title || github.event.issue.title }}
            Is Pull Request: ${{ !!github.event.pull_request }}
            Request Details:
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.pull_request.body || inputs.additional_context }}

            CRITICAL INSTRUCTIONS:
            You MUST execute the necessary tool calls. Do NOT merely describe what to do.

            1. If this is a new issue (Is Pull Request is false):
               - Step 1: Call `create_branch` with owner="${{ github.repository_owner }}", repo="${{ github.event.repository.name }}", branch="gemini/issue-${{ github.event.issue.number }}".
               - Step 2: Read codebase files using `get_file_contents` or `search_code`.
               - Step 3: Call `create_or_update_file` (or `push_files`) with owner="${{ github.repository_owner }}", repo="${{ github.event.repository.name }}", branch="gemini/issue-${{ github.event.issue.number }}" to commit the changes.
               - Step 4: Call `create_pull_request` with owner="${{ github.repository_owner }}", repo="${{ github.event.repository.name }}", title="${{ github.event.issue.title }}", head="gemini/issue-${{ github.event.issue.number }}", base="master", body="Closes #${{ github.event.issue.number }}".
               - Step 5: Call `add_issue_comment` with owner="${{ github.repository_owner }}", repo="${{ github.event.repository.name }}", issue_number=${{ github.event.issue.number }} linking to the created PR.

            2. If this is an existing Pull Request (Is Pull Request is true):
               - Step 1: Inspect the PR using `pull_request_read`.
               - Step 2: Apply the requested changes directly onto the PR branch using `create_or_update_file` or `push_files`.
               - Step 3: Call `add_issue_comment` on the PR confirming the updates.
