name: "🤖 Gemini AI Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

concurrency:
  group: gemini-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  gemini-agent:
    # Only run for repository Owner, Member, or Collaborator when triggered via @ai, @gemini, @gemini-cli, or 'ai-task' label
    # Note: GitHub Actions `contains()` is case-insensitive by default.
    if: >-
      github.event.sender.type == 'User' &&
      (
        (
          github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '@ai') ||
            contains(github.event.comment.body, '@gemini')
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '@ai') ||
            contains(github.event.comment.body, '@gemini')
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) &&
          (
            contains(github.event.review.body, '@ai') ||
            contains(github.event.review.body, '@gemini')
          )
        ) ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'ai-task') ||
            (
              github.event.action == 'opened' &&
              (
                contains(github.event.issue.body, '@ai') ||
                contains(github.event.issue.body, '@gemini') ||
                contains(github.event.issue.title, '@ai') ||
                contains(github.event.issue.title, '@gemini')
              )
            )
          )
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Acknowledge request on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "🤖 Hallo @${{ github.actor }}, ich bearbeite deine Anfrage gerade! ([Fortschritt im Log ansehen](${RUN_URL}))"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git and checkout target branch
        id: branch_setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR: ${{ !!(github.event.pull_request || github.event.issue.pull_request) }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$IS_PR" = "true" ]; then
            echo "Checking out existing Pull Request #$NUMBER..."
            gh pr checkout "$NUMBER"
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="ai/issue-${NUMBER}"
            echo "Setting up branch $BRANCH_NAME for Issue #$NUMBER..."
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            else
              git checkout -b "$BRANCH_NAME"
            fi
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare request context
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          BODY: ${{ github.event.pull_request.body || github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          {
            echo "# Issue / PR Title"
            echo "$TITLE"
            echo ""
            echo "# Issue / PR Description"
            echo "$BODY"
            echo ""
            echo "# Latest User Instruction / Comment"
            echo "$COMMENT"
          } > .gemini-request.md

      - name: Run Gemini CLI to edit files
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 30
              }
            }
          prompt: |-
            You are an autonomous AI web developer maintaining the "Herzenergie Yoga" Astro website in this workspace.

            TASK:
            1. Read `GEMINI.md` to understand the project structure and conventions.
            2. Read `.gemini-request.md` to see the user's request and context.
            3. Inspect the relevant files in `src/` (and `public/` if needed) and directly edit or create the files in the workspace to fulfill the user's request accurately.
            4. Run `npm run build` using your shell tool to verify the Astro build succeeds without errors. If there are any build errors, fix them.
            5. Write a concise German summary of the changes you made to `.gemini-summary.md` (do not commit `.gemini-summary.md` or `.gemini-request.md`).
            6. Do NOT run `git push` or `gh pr create` yourself; the next GitHub Actions step will automatically commit, push, create/update the Pull Request, and deploy the preview.

      - name: Verify build, commit, push, and create/update Pull Request
        id: publish_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch_setup.outputs.branch }}
          IS_PR: ${{ steps.branch_setup.outputs.is_pr }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: |
          SUMMARY=""
          if [ -f .gemini-summary.md ]; then
            SUMMARY=$(cat .gemini-summary.md)
          fi
          rm -rf .gemini .gemini-summary.md .gemini-request.md

          # Ensure clean Astro build before committing
          npm run build

          git add -A
          if git diff --cached --quiet && [ "$(git rev-list --count origin/master..HEAD)" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            COMMENT_BODY=$(printf "ℹ️ Es wurden keine Dateiänderungen vorgenommen.\n\n%s" "$SUMMARY")
            gh issue comment "$NUMBER" --body "$COMMENT_BODY"
            exit 0
          fi

          if ! git diff --cached --quiet; then
            git commit -m "feat: apply AI changes for #${NUMBER}"
          fi

          git push -u origin "$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [ "$IS_PR" = "true" ]; then
            PR_NUMBER="$NUMBER"
          else
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              PR_NUMBER="$EXISTING_PR"
            else
              PR_BODY=$(printf "Automatisch erstellt für #%s.\n\n%s\n\nCloses #%s" "$NUMBER" "$SUMMARY" "$NUMBER")
              PR_URL=$(gh pr create \
                --base master \
                --head "$BRANCH_NAME" \
                --title "${ISSUE_TITLE}" \
                --body "$PR_BODY")
              PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            fi
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Astro site for PR preview
        if: steps.publish_pr.outputs.changed == 'true'
        env:
          ASTRO_BASE: /pr-preview/pr-${{ steps.publish_pr.outputs.pr_number }}/
        run: |
          npm run build

      - name: Deploy PR preview to GitHub Pages
        if: steps.publish_pr.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          branch: gh-pages
          target-folder: pr-preview/pr-${{ steps.publish_pr.outputs.pr_number }}
          clean: true

      - name: Comment PR & Live Preview link
        if: steps.publish_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_NUMBER: ${{ steps.publish_pr.outputs.pr_number }}
          SUMMARY: ${{ steps.publish_pr.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          PREVIEW_URL="https://ninjaseidel.de/pr-preview/pr-${PR_NUMBER}/"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${PREVIEW_URL}"

          cat <<EOF > .pr-comment.md
          ✅ **Änderungen wurden umgesetzt!**

          ${SUMMARY}

          - 🔀 **Pull Request:** #${PR_NUMBER}
          - 🌐 **Live-Vorschau:** [${PREVIEW_URL}](${PREVIEW_URL}) *(in ca. 30–60 Sek. aktualisiert)*

          ![QR Code zur Vorschau](${QR_URL})

          *(Wenn alles passt, kannst du im Pull Request #${PR_NUMBER} auf **Merge pull request** klicken, um die Änderungen live zu schalten, oder dort mit \`@ai ...\` weitere Anpassungen wünschen.)*
          EOF
          sed -i 's/^          //' .pr-comment.md

          gh issue comment "$NUMBER" --repo "$REPO" --body-file .pr-comment.md
          if [ "$NUMBER" != "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file .pr-comment.md
          fi
          rm -f .pr-comment.md

      - name: Report failure on GitHub
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "❌ Entschuldigung @${{ github.actor }}, bei der Verarbeitung ist ein Fehler aufgetreten. Details findest du [im Actions-Log](${RUN_URL})."
