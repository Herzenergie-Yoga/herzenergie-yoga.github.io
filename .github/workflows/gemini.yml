name: "🤖 Gemini AI Assistant"

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue or PR number to process"
        required: true
        type: number

concurrency:
  group: gemini-${{ inputs.issue_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  gemini-agent:
    # Run for any human user action (not bots). Collaborator write/admin access is verified in the first step
    # because GitHub Organization webhooks report author_association as NONE for private org members.
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify collaborator permission & acknowledge request
        id: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.issue_number || github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Actor $ACTOR has permission: $PERM"
          if [[ "$PERM" != "admin" && "$PERM" != "maintain" && "$PERM" != "write" ]]; then
            echo "User $ACTOR does not have write access to $REPO. Skipping."
            exit 1
          fi

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "🤖 Hallo @${ACTOR}, ich bearbeite deine Anfrage gerade! ([Fortschritt im Log ansehen](${RUN_URL}))"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git, checkout branch, and prepare context
        id: branch_setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.init.outputs.number }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          ISSUE_JSON=$(gh api "repos/${REPO}/issues/${NUMBER}")
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title // ""')
          BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          IS_PR=$(echo "$ISSUE_JSON" | jq -r '.pull_request != null')

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Issue / PR Title"
            echo "$TITLE"
            echo ""
            echo "# Issue / PR Description"
            echo "$BODY"
            if [ -n "$COMMENT_BODY" ]; then
              echo ""
              echo "# Latest User Instruction / Comment"
              echo "$COMMENT_BODY"
            fi
          } > .gemini-request.md

          if [ "$IS_PR" = "true" ]; then
            echo "Checking out existing Pull Request #$NUMBER..."
            gh pr checkout "$NUMBER"
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="ai/issue-${NUMBER}"
            echo "Setting up branch $BRANCH_NAME for Issue #$NUMBER..."
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            else
              git checkout -b "$BRANCH_NAME"
            fi
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini CLI to edit files
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 30
              }
            }
          prompt: |-
            You are an autonomous AI web developer maintaining the "Herzenergie Yoga" Astro website in this workspace.

            TASK:
            1. Read `GEMINI.md` to understand the project structure and conventions.
            2. Read `.gemini-request.md` to see the user's request and context.
            3. Inspect the relevant files in the workspace and directly edit or update them (or run `npm update` / `npm install` if requested) to fulfill the user's request accurately.
            4. Run `npm run build` using your shell tool to verify the Astro build succeeds without errors. If there are any build errors, fix them.
            5. Write a concise German summary of the changes you made to `.gemini-summary.md` (do not commit `.gemini-summary.md` or `.gemini-request.md`).
            6. Do NOT run `git push` or `gh pr create` yourself; the next GitHub Actions step will automatically commit, push, create/update the Pull Request, and deploy the preview.

      - name: Verify build, commit, push, and create/update Pull Request
        id: publish_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch_setup.outputs.branch }}
          IS_PR: ${{ steps.branch_setup.outputs.is_pr }}
          NUMBER: ${{ steps.init.outputs.number }}
          ISSUE_TITLE: ${{ steps.branch_setup.outputs.title }}
        run: |
          SUMMARY=""
          if [ -f .gemini-summary.md ]; then
            SUMMARY=$(cat .gemini-summary.md)
          fi
          rm -rf .gemini .gemini-summary.md .gemini-request.md

          # Ensure clean Astro build before committing
          npm run build

          git add -A
          if git diff --cached --quiet && [ "$(git rev-list --count origin/master..HEAD)" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            COMMENT_BODY=$(printf "ℹ️ Es wurden keine Dateiänderungen vorgenommen.\n\n%s" "$SUMMARY")
            gh issue comment "$NUMBER" --body "$COMMENT_BODY"
            exit 0
          fi

          if ! git diff --cached --quiet; then
            git commit -m "feat: apply AI changes for #${NUMBER}"
          fi

          git push -u origin "$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [ "$IS_PR" = "true" ]; then
            PR_NUMBER="$NUMBER"
          else
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              PR_NUMBER="$EXISTING_PR"
            else
              PR_BODY=$(printf "Automatisch erstellt für #%s.\n\n%s\n\nCloses #%s" "$NUMBER" "$SUMMARY" "$NUMBER")
              PR_URL=$(gh pr create \
                --base master \
                --head "$BRANCH_NAME" \
                --title "${ISSUE_TITLE}" \
                --body "$PR_BODY")
              PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            fi
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Astro site for PR preview
        if: steps.publish_pr.outputs.changed == 'true'
        env:
          ASTRO_BASE: /pr-preview/pr-${{ steps.publish_pr.outputs.pr_number }}/
        run: |
          npm run build

      - name: Deploy PR preview to GitHub Pages
        if: steps.publish_pr.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          branch: gh-pages
          target-folder: pr-preview/pr-${{ steps.publish_pr.outputs.pr_number }}
          clean: true

      - name: Comment PR & Live Preview link
        if: steps.publish_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.init.outputs.number }}
          PR_NUMBER: ${{ steps.publish_pr.outputs.pr_number }}
          SUMMARY: ${{ steps.publish_pr.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          PREVIEW_URL="https://ninjaseidel.de/pr-preview/pr-${PR_NUMBER}/"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${PREVIEW_URL}"

          cat <<EOF > .pr-comment.md
          ✅ **Änderungen wurden umgesetzt!**

          ${SUMMARY}

          - 🔀 **Pull Request:** #${PR_NUMBER}
          - 🌐 **Live-Vorschau:** [${PREVIEW_URL}](${PREVIEW_URL}) *(in ca. 30–60 Sek. aktualisiert)*

          ![QR Code zur Vorschau](${QR_URL})

          *(Wenn alles passt, kannst du im Pull Request #${PR_NUMBER} auf **Merge pull request** klicken, um die Änderungen live zu schalten, oder dort einen Kommentar für weitere Anpassungen hinterlassen.)*
          EOF
          sed -i 's/^          //' .pr-comment.md

          gh issue comment "$NUMBER" --repo "$REPO" --body-file .pr-comment.md
          if [ "$NUMBER" != "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file .pr-comment.md
          fi
          rm -f .pr-comment.md

      - name: Report failure on GitHub
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.init.outputs.number || inputs.issue_number || github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "❌ Entschuldigung @${{ github.actor }}, bei der Verarbeitung ist ein Fehler aufgetreten. Details findest du [im Actions-Log](${RUN_URL})."
